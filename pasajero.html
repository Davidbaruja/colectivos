<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasajero</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  body { font-family: sans-serif; margin: 10px; }
  #mapa { height: 50vh; margin-top: 10px; }
  .bus { background: #f1f3f4; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .bus-icono { position: relative; width: 44px; height: 44px; }
  .bus-icono span {
    position: absolute; inset: 4px; display: flex; align-items: center; justify-content: center;
    background: #fff; border: 3px solid #1a73e8; border-radius: 50%; font-size: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .flecha { position: absolute; inset: 0; display: none; }
  .flecha::before {
    content: ''; position: absolute; top: -10px; left: 50%; margin-left: -8px;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 13px solid #1a73e8;
  }
</style>
</head>
<body>
<h3>Colectivos en recorrido</h3>
<p id="info">Esperando colectivos...</p>
<div id="mapa"></div>
<div id="lista"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAgXGe2yG3QDv7reBa0Oet5nGjK7XIQaA0",
    authDomain: "colectivos-7caae.firebaseapp.com",
    databaseURL: "https://colectivos-7caae-default-rtdb.firebaseio.com",
    projectId: "colectivos-7caae",
    appId: "1:419518705953:web:6a20b7cc82f3b1e368ce60"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const $ = function (id) { return document.getElementById(id); };
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  const mapa = L.map('mapa').setView([-25.7, -57.2], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(mapa);

  let buses = {};
  const marcadores = {};
  let centrado = false;

  function detalle(b) {
    const seg = Math.round((Date.now() - b.hora) / 1000);
    return '<b>Colectivo N° ' + esc(b.numero) + '</b><br>' +
      'Chapa: ' + esc(b.chapa) + ' · Año: ' + esc(b.anio) + '<br>' +
      'Conductor: ' + esc(b.chofer) + '<br>' +
      'Guarda: ' + esc(b.guarda) + '<br>' +
      'Ruta: ' + esc(b.ruta) + '<br>' +
      'Salida: ' + esc(b.salida) + ' hs<br>' +
      'Última señal hace ' + seg + ' segundos';
  }

  function dibujar() {
    const ids = Object.keys(buses);
    $('info').textContent = ids.length ? ids.length + ' colectivo(s) en recorrido' : 'No hay colectivos en recorrido';
    let html = '';
    ids.forEach(function (id) {
      html += '<div class="bus" data-id="' + esc(id) + '">' + detalle(buses[id]) + '</div>';
      if (marcadores[id]) { marcadores[id].setPopupContent(detalle(buses[id])); }
    });
    $('lista').innerHTML = html;
  }

  $('lista').onclick = function (e) {
    const el = e.target.closest('.bus');
    if (!el) return;
    const id = el.dataset.id;
    if (buses[id] && marcadores[id]) {
      mapa.setView([buses[id].lat, buses[id].lng], 15);
      marcadores[id].openPopup();
    }
  };
  function iconoBus() {
    return L.divIcon({
      className: '',
      html: '<div class="bus-icono"><div class="flecha"></div><span>🚌</span></div>',
      iconSize: [44, 44], iconAnchor: [22, 22], popupAnchor: [0, -22]
    });
  }

  function girar(m, r) {
    const el = m.getElement();
    if (!el) return;
    const f = el.querySelector('.flecha');
    if (r == null) { f.style.display = 'none'; }
    else { f.style.display = 'block'; f.style.transform = 'rotate(' + r + 'deg)'; }
  }
  db.ref('buses').on('value', function (snap) {
    buses = snap.val() || {};
    Object.keys(marcadores).forEach(function (id) {
      if (!buses[id]) { mapa.removeLayer(marcadores[id]); delete marcadores[id]; }
    });
    const ids = Object.keys(buses);
    ids.forEach(function (id) {
      const b = buses[id];
           if (!marcadores[id]) {
        marcadores[id] = L.marker([b.lat, b.lng], { icon: iconoBus() }).addTo(mapa).bindPopup(detalle(b));
      } else {
        marcadores[id].setLatLng([b.lat, b.lng]);
      }
      girar(marcadores[id], b.rumbo);
    });
    if (!centrado && ids.length) {
      mapa.fitBounds(ids.map(function (id) { return [buses[id].lat, buses[id].lng]; }),
        { maxZoom: 14, padding: [30, 30] });
      centrado = true;
    }
    dibujar();
  });

  setInterval(dibujar, 1000);
</script>
</body>
</html>

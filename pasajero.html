<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasajero</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  body { font-family: sans-serif; margin: 10px; }
  #mapa { height: 75vh; margin-top: 10px; }
</style>
</head>
<body>
<h3>Colectivo a Ybycuí</h3>
<p id="info">Esperando al colectivo...</p>
<div id="mapa"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAgXGe2yG3QDv7reBa00et5nGjK7XIQaA0",
    authDomain: "colectivos-7caae.firebaseapp.com",
    databaseURL: "https://colectivos-7caae-default-rtdb.firebaseio.com",
    projectId: "colectivos-7caae",
    appId: "1:419518705953:web:6a20b7cc82f3b1e368ce60"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const mapa = L.map('mapa').setView([-25.7, -57.2], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(mapa);

  let marcador = null;
  let ultimaHora = null;

  function actualizarTexto() {
    if (ultimaHora === null) return;
    const seg = Math.round((Date.now() - ultimaHora) / 1000);
    document.getElementById('info').textContent = 'Última señal hace ' + seg + ' segundos';
  }
  setInterval(actualizarTexto, 1000);

  db.ref('buses/bus1').on('value', function (snap) {
    const d = snap.val();
    if (!d) {
      ultimaHora = null;
      document.getElementById('info').textContent = 'El colectivo no está en recorrido';
      if (marcador) { mapa.removeLayer(marcador); marcador = null; }
      return;
    }
    ultimaHora = d.hora;
    actualizarTexto();
    if (!marcador) {
      marcador = L.marker([d.lat, d.lng]).addTo(mapa);
      mapa.setView([d.lat, d.lng], 14);
    } else {
      marcador.setLatLng([d.lat, d.lng]);
    }
  });
</script>
</body>
</html>

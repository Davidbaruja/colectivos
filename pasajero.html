<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colectivos en vivo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #202124; background: #fff; }
  #app { display: flex; height: 100vh; }
  #panel { width: 370px; overflow-y: auto; padding: 12px; border-right: 1px solid #ddd; }
  #mapa { flex: 1; }
  @media (max-width: 700px) {
    #app { flex-direction: column; height: auto; }
    #mapa { height: 50vh; flex: none; order: -1; }
    #panel { width: 100%; border-right: 0; }
  }
  h2 { font-size: 19px; margin: 4px 0 10px; }
  h3 { font-size: 15px; margin: 18px 0 6px; color: #5f6368; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 100%; margin: 3px 0; }
  button { background: #1a73e8; color: #fff; border: 0; cursor: pointer; }
  button.sec { background: #f1f3f4; color: #202124; }
  .fila { display: flex; gap: 6px; }
  .bus-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; background: #f1f3f4; margin: 6px 0; border: 2px solid transparent; }
  .bus-fila.sel { border-color: #e8710a; background: #fef7e0; }
  .bus-fila .txt { flex: 1; cursor: pointer; line-height: 1.4; }
  .campana { width: auto; background: none; font-size: 22px; padding: 4px; margin: 0; }
  .empresa { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; background: #e8f0fe; margin: 6px 0; cursor: pointer; }
  .empresa span { font-size: 13px; color: #5f6368; }
  .aviso-min { flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5f6368; padding-top: 8px; border-top: 1px solid #dadce0; margin-top: 2px; }
  .aviso-min select { font-size: 15px; padding: 6px; border-radius: 8px; border: 1px solid #ccc; width: auto; background: #fff; }
  .etq { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: #188038; color: #fff; }
  .etq.gris { background: #80868b; }
  .etq.azul { background: #1a73e8; }
  #detalle { background: #fef7e0; border: 2px solid #e8710a; border-radius: 12px; padding: 12px; margin-bottom: 10px; line-height: 1.5; }
  .det-cab { display: flex; justify-content: space-between; align-items: center; }
  .cerrar { width: auto; background: #e8710a; padding: 4px 10px; margin: 0; }
  .icono-bus { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .tiempos { display: flex; gap: 8px; margin: 8px 0 4px; }
  .tiempos div { flex: 1; background: #fff; border-radius: 10px; padding: 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .tiempos small { display: block; color: #5f6368; }
  .tiempos b { font-size: 18px; }
  .barra { height: 8px; background: #dadce0; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
  .barra i { display: block; height: 100%; background: #e8710a; }
  .parada-mia { background: #1a73e8; color: #fff; border-radius: 10px; padding: 10px; text-align: center; margin: 8px 0; }
  .parada-mia b { display: block; font-size: 24px; }
  .oculto { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #202124; color: #fff;
           padding: 12px 16px; border-radius: 10px; z-index: 2000; max-width: 90%; font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h2>🚌 Colectivos en vivo</h2>
    <div id="detalle" class="oculto"></div>

    <input id="desde" list="listaParadas" placeholder="Salgo desde (ej: Asunción)">
    <input id="hasta" list="listaParadas" placeholder="Voy hasta (ej: Ybycuí)">
    <datalist id="listaParadas"></datalist>
    <div class="fila">
      <button id="btnBuscar">Buscar</button>
      <button id="btnLimpiar" class="sec">Limpiar</button>
    </div>
    <button id="btnUbic" class="sec">📍 Usar mi ubicación</button>

    <h3 id="tituloRes" class="oculto">Resultados</h3>
    <div id="resultados"></div>

    <h3 id="contador">Cargando...</h3>
    <div id="empresas"></div>
  </div>
  <div id="mapa"></div>
</div>
<div id="toast" class="oculto"></div>

<script>
  // Pegá acá la MISMA apiKey que pusiste en chofer.html
  const firebaseConfig = {
    apiKey: "AIzaSyAgXGe2yG3QDv7reBa0Oet5nGjK7XIQaA0",
    authDomain: "colectivos-7caae.firebaseapp.com",
    databaseURL: "https://colectivos-7caae-default-rtdb.firebaseio.com",
    projectId: "colectivos-7caae",
    appId: "1:419518705953:web:6a20b7cc82f3b1e368ce60"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const $ = function (id) { return document.getElementById(id); };
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  const mapa = L.map('mapa').setView([-25.7, -57.2], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(mapa);

  // ----- Datos -----
  let empresas = {}, rutas = {}, colectivos = {}, buses = {}, salidasHoy = {};
  const marcadores = {};
  const geometrias = {};
  let seleccionado = null, capaRuta = null;
  let filtro = null, empresaAbierta = null;
  let miPos = null, miMarcador = null;
  let activosPrevios = null, centrado = false;
  let avisos = cargar('avisos');        // campanita de cada colectivo
  let minAvisos = cargar('minAvisos');  // minutos de aviso de cada colectivo
  let enviados = cargar('enviados');    // avisos de "está por salir" ya mandados hoy
  const MIN_DEFECTO = 30;
  function minDe(id) { return Number(minAvisos[id]) || MIN_DEFECTO; }
  const MAX_SIN_SENAL = 10 * 60 * 1000; // 10 minutos sin señal = ya no está en recorrido

  function km(a, b) { return mapa.distance([a.lat, a.lng], [b.lat, b.lng]) / 1000; }
  function paradasDe(rid) { const r = rutas[rid]; return r && r.paradas ? Object.values(r.paradas) : []; }
  function estaActivo(id) { const b = buses[id]; return !!(b && Date.now() - b.hora < MAX_SIN_SENAL); }
  function activos() { return Object.keys(buses).filter(estaActivo); }

  function indice(rid, nombre) {
    const q = norm(nombre);
    return paradasDe(rid).findIndex(function (s) { return norm(s.nombre).indexOf(q) >= 0; });
  }

  function paradaCercana(rid, p) {
    let mejor = null;
    paradasDe(rid).forEach(function (s, i) {
      const d = km(s, p);
      if (!mejor || d < mejor.d) { mejor = { i: i, nombre: s.nombre, d: d }; }
    });
    return mejor;
  }

  function dondeEsta(id) {
    const c = colectivos[id] || {};
    const b = buses[id];
    if (!b) return '';
    const s = lugarEnRuta(b, paradasDe(c.rutaId), geoListo(c.rutaId));
    if (!b.lugar) return s;
    // Ciudad real publicada por el chofer; si la parada más cercana dice otra cosa, se agrega
    return 'En ' + b.lugar + (s && norm(s).indexOf(norm(b.lugar)) < 0 ? ' · ' + s : '');
  }

  // Punto del pasajero: su ubicación, o la parada de "Salgo desde"
  function puntoRef() {
    if (miPos) return miPos;
    if (filtro && filtro.desde && filtro.rutas.length) {
      const rid = filtro.rutas[0];
      const i = indice(rid, filtro.desde);
      if (i >= 0) return paradasDe(rid)[i];
    }
    return null;
  }

  function distanciaM(a, b) { return mapa.distance(a, b); }

  // ¿El colectivo viene hacia el pasajero o ya pasó su parada?
  function viene(id) {
    const c = colectivos[id], b = buses[id];
    const ref = puntoRef();
    if (!c || !b || !ref) return null;
    const g = geoListo(c.rutaId);
    if (!g || g.length < 2) return null;
    return enRuta(g, b, distanciaM).km <= enRuta(g, ref, distanciaM).km + 0.3;
  }

  // ----- Cálculo de tiempos -----
  // 45 -> "45 min" · 75 -> "1 h 15 min"
  function duracion(min) {
    const m = Math.max(0, Math.round(min));
    if (m < 1) return 'menos de 1 min';
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
  }
  function horaEn(min) {
    const d = new Date(Date.now() + min * 60000);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  // Minutos desde que inició el recorrido (si falta el dato, desde la hora de salida)
  function minutosEnViaje(b) {
    if (b.inicio) return Math.max(0, (Date.now() - b.inicio) / 60000);
    const p = String(b.salida || '').split(':');
    if (p.length < 2) return null;
    const d = new Date();
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    return d <= new Date() ? (Date.now() - d) / 60000 : null;
  }
  // En qué kilómetro de la ruta está un punto, y a qué distancia de ella
  function enRuta(g, p, distancia) {
    let total = 0, aqui = 0, lejos = Infinity;
    g.forEach(function (q, i) {
      if (i) { total += distancia(g[i - 1], q) / 1000; }
      const d = distancia(q, [p.lat, p.lng]) / 1000;
      if (d < lejos) { lejos = d; aqui = total; }
    });
    return { km: aqui, lejos: lejos, total: total };
  }
  function horaDe(t) {
    const d = new Date(t);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  // Hora real en que inició; si difiere de la programada, muestra las dos
  function textoSalida(b) {
    if (!b.inicio) return (b.salida || '-') + ' hs';
    const real = horaDe(b.inicio);
    const p = String(b.salida || '').split(':');
    const d = new Date(b.inicio);
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    const distinta = p.length === 2 && Math.abs(d - b.inicio) > 5 * 60000;
    return real + ' hs' + (distinta ? ' (programada ' + b.salida + ')' : '');
  }
  // "En X", "Cerca de X" o "Entre X y Y" según dónde está sobre la ruta
  function lugarEnRuta(b, ps, g) {
    let cerca = null, d = Infinity;
    ps.forEach(function (p) {
      const x = distanciaM([p.lat, p.lng], [b.lat, b.lng]);
      if (x < d) { d = x; cerca = p; }
    });
    if (!cerca) return '';
    if (d < 3000) return 'En ' + cerca.nombre;
    if (d < 10000 || !g || g.length < 2) return 'Cerca de ' + cerca.nombre;
    const aqui = enRuta(g, b, distanciaM).km;
    for (let i = 1; i < ps.length; i++) {
      if (enRuta(g, ps[i], distanciaM).km >= aqui) return 'Entre ' + ps[i - 1].nombre + ' y ' + ps[i].nombre;
    }
    return 'Cerca de ' + cerca.nombre;
  }
  function cajasViaje(b, g, kmh, ps) {
    const lleva = minutosEnViaje(b);
    const destino = ps.length ? ps[ps.length - 1].nombre : 'el destino';
    let falta = 'Calculando...', pie = '', hecho = '', avance = null;
    if (g && g.length > 1) {
      const r = enRuta(g, b, distanciaM);
      const resto = r.total - r.km;
      avance = r.total ? Math.round(r.km / r.total * 100) : 0;
      hecho = Math.round(r.km) + ' km de la ruta';
      if (resto < 0.3) { falta = 'Llegando'; }
      else {
        const min = resto / kmh * 60;
        falta = '~' + duracion(min);
        pie = Math.round(resto) + ' km · llega aprox. a las ' + horaEn(min);
      }
    }
    return '<div class="tiempos"><div><small>⏱ En viaje hace</small><b>' + (lleva === null ? '-' : duracion(lleva)) + '</b><small>' + hecho + '</small></div>' +
      '<div><small>🏁 Para llegar a ' + esc(destino) + '</small><b>' + falta + '</b><small>' + pie + '</small></div></div>' +
      (avance === null ? '' : '<div class="barra"><i style="width:' + avance + '%"></i></div>');
  }

  function fechaDe(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fechaHoy() { return fechaDe(new Date()); }
  function aMin(hm) { const p = String(hm).split(':'); return Number(p[0]) * 60 + Number(p[1]); }

  const DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const ORDEN_DIAS = [1, 2, 3, 4, 5, 6, 0];

  // Cada salida: { hora, terminal, tipo: 'todos' | 'dias' | 'fecha', dias: [0-6], fecha }
  // Las salidas viejas (solo texto "05:20") se leen como "todos los días, sin terminal"
  function normSalidas(c) {
    return Object.values((c && c.salidas) || {}).map(function (s) {
      if (typeof s === 'string') { return { hora: s, terminal: '', tipo: 'todos', dias: [], fecha: '' }; }
      return {
        hora: s.hora || '', terminal: s.terminal || '', tipo: s.tipo || 'todos',
        dias: Object.values(s.dias || {}).map(Number), fecha: s.fecha || ''
      };
    }).sort(function (x, y) { return x.hora < y.hora ? -1 : (x.hora > y.hora ? 1 : 0); });
  }
  function aplicaEn(s, d) {
    if (s.tipo === 'fecha') return s.fecha === fechaDe(d);
    if (s.tipo === 'dias') return s.dias.indexOf(d.getDay()) >= 0;
    return true;
  }
  function fechaCorta(f) { const q = String(f).split('-'); return q.length === 3 ? q[2] + '/' + q[1] + '/' + q[0] : f; }
  function cuandoSale(s) {
    if (s.tipo === 'fecha') return 'solo el ' + fechaCorta(s.fecha);
    if (s.tipo === 'dias') {
      const d = ORDEN_DIAS.filter(function (x) { return s.dias.indexOf(x) >= 0; }).map(function (x) { return DIAS_LARGO[x]; });
      if (d.length === 7) return 'todos los días';
      if (d.length === 1) return 'todos los ' + d[0];
      return d.slice(0, -1).join(', ') + ' y ' + d[d.length - 1];
    }
    return 'todos los días';
  }
  function etiquetaSalida(s) { return s.hora + ' hs' + (s.terminal ? ' · desde ' + s.terminal : ''); }

  // Salidas que corresponden a hoy; si el chofer eligió otra hora,
  // esa reemplaza a la salida de hoy más cercana
  function salidasDe(id) {
    const c = colectivos[id] || {};
    const lista = normSalidas(c).filter(function (s) { return aplicaEn(s, new Date()); });
    const o = salidasHoy[id];
    if (o && o.hora && o.fecha === fechaHoy()) {
      if (!lista.length) { lista.push({ hora: o.hora, terminal: '', tipo: 'fecha', dias: [], fecha: o.fecha }); }
      else {
        let k = 0, mejor = Infinity;
        lista.forEach(function (x, i) {
          const d = Math.abs(aMin(x.hora) - aMin(o.hora));
          if (d < mejor) { mejor = d; k = i; }
        });
        lista[k] = Object.assign({}, lista[k], { hora: o.hora });
      }
    }
    return lista.sort(function (x, y) { return x.hora < y.hora ? -1 : (x.hora > y.hora ? 1 : 0); });
  }

  // ¿El chofer cambió el horario de hoy?
  function horarioCambiado(id) {
    const o = salidasHoy[id];
    return !!(o && o.hora && o.fecha === fechaHoy());
  }

  function proximaSalida(id) {
    const n = new Date();
    const hm = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
    const hoy = salidasDe(id).filter(function (s) { return s.hora >= hm; })[0];
    if (hoy) return etiquetaSalida(hoy);
    const todas = normSalidas(colectivos[id] || {});
    for (let i = 1; i <= 14; i++) {
      const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + i);
      const l = todas.filter(function (s) { return aplicaEn(s, d); });
      if (l.length) {
        return etiquetaSalida(l[0]) + ' (' + (i === 1 ? 'mañana' : DIAS_LARGO[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1)) + ')';
      }
    }
    return '';
  }

  // Todos los horarios cargados, con sus días
  function horariosCompletos(c) {
    const l = normSalidas(c);
    if (!l.length) return '';
    return '<small>' + l.map(function (s) {
      return '🕒 ' + esc(etiquetaSalida(s)) + ' · ' + esc(cuandoSale(s));
    }).join('<br>') + '</small><br>';
  }

  // ----- Hora estimada de llegada -----
  const historia = {};      // últimas posiciones de cada colectivo (para calcular su velocidad real)
  const pidiendoGeo = {};
  const VEL_DEFECTO = 40;   // km/h, si todavía no se pudo medir la velocidad real

  function registrarPosiciones() {
    Object.keys(historia).forEach(function (id) { if (!buses[id]) delete historia[id]; });
    Object.keys(buses).forEach(function (id) {
      const b = buses[id];
      const h = historia[id] = historia[id] || [];
      const ult = h[h.length - 1];
      if (ult && ult.t === b.hora) return;
      h.push({ t: b.hora, lat: b.lat, lng: b.lng });
      while (h.length && b.hora - h[0].t > 10 * 60 * 1000) { h.shift(); }
    });
  }

  // Velocidad real medida en los últimos 5 minutos (null si todavía hay pocos datos)
  function velocidadKmh(id) {
    const h = historia[id] || [];
    if (h.length < 2) return null;
    const p1 = h[h.length - 1];
    const p0 = h.filter(function (p) { return p1.t - p.t <= 5 * 60 * 1000; })[0];
    if (!p0 || p1.t - p0.t < 60000) return null;
    return km(p0, p1) / ((p1.t - p0.t) / 3600000);
  }

  function geoListo(rid) {
    if (geometrias[rid]) return geometrias[rid];
    if (rid && !pidiendoGeo[rid]) {
      pidiendoGeo[rid] = true;
      obtenerGeometria(rid).then(function () { render(); });
    }
    return null;
  }

  function indiceCercano(g, p) {
    let k = 0, mejor = Infinity;
    g.forEach(function (q, i) {
      const d = Math.pow(q[0] - p.lat, 2) + Math.pow(q[1] - p.lng, 2);
      if (d < mejor) { mejor = d; k = i; }
    });
    return k;
  }

  function velocidadUsada(id) {
    return Math.min(90, Math.max(15, velocidadKmh(id) || VEL_DEFECTO));
  }

  // Minutos que faltan para que llegue a tu punto (por la ruta, no en línea recta)
  function etaMin(id) {
    const c = colectivos[id], b = buses[id], ref = puntoRef();
    if (!c || !b || !ref || !estaActivo(id)) return null;
    const g = geoListo(c.rutaId);
    if (!g || g.length < 2) return null;
    const bus = enRuta(g, b, distanciaM), yo = enRuta(g, ref, distanciaM);
    if (yo.lejos > 3) return { lejos: yo.lejos };
    if (km(b, ref) < 0.3) return { min: 0, km: km(b, ref) };
    if (yo.km < bus.km) return { paso: true };
    return { min: (yo.km - bus.km) / velocidadUsada(id) * 60, km: yo.km - bus.km };
  }

  function textoEta(id) {
    const e = etaMin(id);
    if (!e || e.min === undefined) return '';
    return e.min < 1 ? '⏱ Está llegando' : '⏱ Llega en ~' + duracion(e.min);
  }

  // Cuadro destacado: en cuánto llega a donde está esperando el pasajero
  function cajaMiParada(id) {
    if (!puntoRef()) {
      return '<div class="parada-mia">📍 Activá tu ubicación para saber cuándo llega a tu parada' +
        '<button class="sec" id="btnMiParada">Usar mi ubicación</button></div>';
    }
    const e = etaMin(id);
    let t;
    if (!e) t = 'Calculando...';
    else if (e.lejos) t = 'Estás a ' + e.lejos.toFixed(1) + ' km de esta ruta';
    else if (e.paso) t = 'Ya pasó tu parada';
    else if (e.min < 1) t = '<b>Está llegando</b>';
    else t = '<b>~' + duracion(e.min) + '</b>aprox. a las ' + horaEn(e.min);
    const titulo = (e && e.min >= 1) ? '🚏 Llega a ' + (miPos ? 'tu ubicación' : 'tu parada') + ' en' : '🚏 Tu parada';
    return '<div class="parada-mia">' + titulo + '<br>' + t + '</div>';
  }

  // ----- Ícono del colectivo (el frente apunta hacia donde va) -----
  function iconoBus(rumbo, sel) {
    const color = sel ? '#e8710a' : '#1a73e8';
    const r = (rumbo == null || isNaN(rumbo)) ? null : rumbo;
    const t = sel ? 50 : 40;
    const svg =
      '<svg width="' + t + '" height="' + t + '" viewBox="0 0 40 40">' +
      '<g transform="rotate(' + (r || 0) + ' 20 20)">' +
      (r == null ? '' : '<path d="M20 0 L26 7 L14 7 Z" fill="' + color + '"/>') +
      '<rect x="12" y="8" width="16" height="28" rx="4" fill="' + color + '" stroke="#fff" stroke-width="2"/>' +
      '<rect x="14.5" y="11" width="11" height="5" rx="1.5" fill="#d2e3fc"/>' +
      '<rect x="14.5" y="19" width="11" height="3" rx="1" fill="#fff" opacity=".5"/>' +
      '<rect x="14.5" y="25" width="11" height="3" rx="1" fill="#fff" opacity=".5"/>' +
      '</g></svg>';
    return L.divIcon({ className: 'icono-bus', html: svg, iconSize: [t, t], iconAnchor: [t / 2, t / 2] });
  }

  function visibleEnMapa(id) {
    if (!filtro) return true;
    const c = colectivos[id];
    return !!(c && filtro.rutas.indexOf(c.rutaId) >= 0);
  }

  function actualizarMarcadores() {
    const ids = activos().filter(visibleEnMapa);
    Object.keys(marcadores).forEach(function (id) {
      if (ids.indexOf(id) < 0) { mapa.removeLayer(marcadores[id]); delete marcadores[id]; }
    });
    ids.forEach(function (id) {
      const b = buses[id];
      const icono = iconoBus(b.rumbo, id === seleccionado);
      if (!marcadores[id]) {
        marcadores[id] = L.marker([b.lat, b.lng], { icon: icono }).addTo(mapa);
        marcadores[id].on('click', function () { seleccionar(id); });
      } else {
        marcadores[id].setLatLng([b.lat, b.lng]);
        marcadores[id].setIcon(icono);
      }
      marcadores[id].setZIndexOffset(id === seleccionado ? 1000 : 0);
    });
    if (!centrado && ids.length) {
      mapa.fitBounds(ids.map(function (id) { return [buses[id].lat, buses[id].lng]; }), { maxZoom: 13, padding: [40, 40] });
      centrado = true;
    }
  }

  // ----- Ruta del colectivo seleccionado -----
  function obtenerGeometria(rid) {
    if (geometrias[rid]) return Promise.resolve(geometrias[rid]);
    const ps = paradasDe(rid);
    const recta = ps.map(function (p) { return [p.lat, p.lng]; });
    if (ps.length < 2) return Promise.resolve(recta);
    const coords = ps.map(function (p) { return p.lng + ',' + p.lat; }).join(';');
    return fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        const g = j.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
        geometrias[rid] = g;
        return g;
      })
      .catch(function () { geometrias[rid] = recta; return recta; });
  }

  function borrarRuta() {
    if (capaRuta) { mapa.removeLayer(capaRuta.grupo); capaRuta = null; }
  }

  function dibujarRuta() {
    borrarRuta();
    const id = seleccionado;
    const c = colectivos[id];
    if (!c || !c.rutaId) return;
    obtenerGeometria(c.rutaId).then(function (g) {
      if (seleccionado !== id) return;
      borrarRuta();
      const grupo = L.layerGroup().addTo(mapa);
      capaRuta = {
        grupo: grupo, geo: g,
        hecha: L.polyline([], { color: '#9aa0a6', weight: 5, opacity: 0.9 }).addTo(grupo),
        falta: L.polyline([], { color: '#e8710a', weight: 6 }).addTo(grupo)
      };
      paradasDe(c.rutaId).forEach(function (p) {
        L.circleMarker([p.lat, p.lng], { radius: 6, color: '#e8710a', weight: 3, fillColor: '#fff', fillOpacity: 1 })
          .bindTooltip(esc(p.nombre)).addTo(grupo);
      });
      actualizarRuta();
      mapa.fitBounds(L.latLngBounds(g), { padding: [30, 30] });
      render();
    });
  }

  // Gris = lo que ya recorrió, naranja = lo que le falta
  function actualizarRuta() {
    if (!capaRuta) return;
    const g = capaRuta.geo;
    const b = estaActivo(seleccionado) ? buses[seleccionado] : null;
    if (!b) { capaRuta.hecha.setLatLngs([]); capaRuta.falta.setLatLngs(g); return; }
    let k = 0, mejor = Infinity;
    g.forEach(function (p, i) {
      const d = Math.pow(p[0] - b.lat, 2) + Math.pow(p[1] - b.lng, 2);
      if (d < mejor) { mejor = d; k = i; }
    });
    capaRuta.hecha.setLatLngs(g.slice(0, k + 1).concat([[b.lat, b.lng]]));
    capaRuta.falta.setLatLngs([[b.lat, b.lng]].concat(g.slice(k + 1)));
  }

  function seleccionar(id) {
    if (seleccionado === id) { deseleccionar(); return; }
    seleccionado = id;
    dibujarRuta();
    actualizarMarcadores();
    render();
    if (!miPos) { pedirUbicacion(false); }
    if (window.innerWidth <= 700) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }

  function deseleccionar() {
    seleccionado = null;
    borrarRuta();
    actualizarMarcadores();
    render();
  }

  // ----- Panel izquierdo -----
  function filaBus(id, masCerca, conAviso) {
    const c = colectivos[id] || {};
    const e = empresas[c.empresa];
    let estado;
    if (estaActivo(id)) {
      estado = '<span class="etq">En recorrido</span> ' + esc(dondeEsta(id));
      const ref = puntoRef();
      if (ref) {
        estado += '<br><small>A ' + distanciaTexto(km(buses[id], ref)) + ' de vos';
        const v = viene(id);
        if (v === true) estado += ' · viene hacia vos';
        if (v === false) estado += ' · ya pasó';
        estado += '</small>';
        const eta = textoEta(id);
        if (eta) { estado += '<br><b>' + eta + '</b>'; }
      }
    } else {
      estado = '<span class="etq gris">Sale ' + esc(proximaSalida(id) || 'sin horario') + '</span>' +
        (horarioCambiado(id) ? ' <small>🕒 horario cambiado hoy</small>'
          : (c.horarioFijo ? ' <span class="etq azul">📌 Horario fijo</span>' : ''));
    }
    return '<div class="bus-fila' + (id === seleccionado ? ' sel' : '') + '" data-id="' + esc(id) + '">' +
      '<div class="txt"><b>🚌 N° ' + esc(c.numero) + '</b> ' +
      (masCerca ? '<span class="etq azul">⭐ Más cerca</span>' : '') +
      '<br><small>' + esc(e ? e.nombre : '') + ' · ' + esc(c.ruta) + '</small><br>' + estado + '</div>' +
      '<button class="campana" data-aviso="' + esc(id) + '" title="Activar avisos">' +
      (avisos[id] ? '🔔' : '🔕') + '</button>' +
      (conAviso && avisos[id] ? (estaActivo(id) ? selectorCerca(id) : selectorAviso(id)) : '') + '</div>';
  }

  function selectorAviso(id) {
    const m = minDe(id);
    function op(v, t) { return '<option value="' + v + '"' + (m === v ? ' selected' : '') + '>' + t + '</option>'; }
    return '<div class="aviso-min">🔔 Avisarme ' +
      '<select class="sel-min" data-id="' + esc(id) + '">' + op(15, '15 min') + op(30, '30 min') + op(60, '1 hora') + '</select>' +
      ' antes de salir</div>';
  }

  // Con el colectivo en camino: avisar cuando esté cerca de tu parada
  let minCerca = cargar('minCerca');
  let avisadosCerca = cargar('avisadosCerca');
  function cercaMin(id) { return Number(minCerca[id]) || 10; }
  function distanciaTexto(d) { return d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km'; }

  function selectorCerca(id) {
    if (!avisos[id]) {
      return '<div class="aviso-min"><button class="sec" data-aviso="' + esc(id) + '">🔔 Avisarme cuando esté cerca</button></div>';
    }
    const m = cercaMin(id);
    return '<div class="aviso-min">🔔 Avisarme cuando falten ' +
      '<select class="sel-cerca" data-id="' + esc(id) + '">' + [3, 5, 10, 15, 30].map(function (v) {
        return '<option value="' + v + '"' + (m === v ? ' selected' : '') + '>' + v + ' min</option>';
      }).join('') + '</select> para que llegue</div>';
  }

  // Aviso 3: "Se acerca tu colectivo" (una sola vez por viaje)
  function revisarLlegadas() {
    activos().forEach(function (id) {
      if (!suscrito(id)) return;
      const e = etaMin(id);
      if (!e || e.min === undefined) return;
      // Avisa por minutos, o si ya está a 1 km o menos (aunque el cálculo de tiempo diga más)
      if (e.min > cercaMin(id) && !(e.km !== undefined && e.km <= 1)) return;
      const viaje = String(buses[id].inicio || fechaHoy() + buses[id].salida);
      if (avisadosCerca[id] === viaje) return;
      avisadosCerca[id] = viaje;
      guardar('avisadosCerca', avisadosCerca);
      notificar('🚏 Se acerca tu colectivo',
        infoBus(id) + '\n' + (e.min < 1 ? 'Está llegando a tu parada' : 'Llega en ~' + duracion(e.min) +
          (e.km !== undefined ? ' · a ' + distanciaTexto(e.km) : '')) + '\n' + dondeEsta(id), id);
    });
  }
  function eligiendo() {
    const a = document.activeElement;
    return !!(a && a.classList && (a.classList.contains('sel-min') || a.classList.contains('sel-cerca')));
  }

  function ordenar(ids) {
    const ref = puntoRef();
    return ids.slice().sort(function (a, b) {
      const aa = estaActivo(a), ab = estaActivo(b);
      if (aa !== ab) return aa ? -1 : 1;
      if (aa && ab) {
        const va = viene(a) !== false, vb = viene(b) !== false;
        if (va !== vb) return va ? -1 : 1;
        if (ref) return km(buses[a], ref) - km(buses[b], ref);
      }
      return (colectivos[a].numero || 0) - (colectivos[b].numero || 0);
    });
  }

  function renderDetalle() {
    if (eligiendo()) return;
    const box = $('detalle');
    if (!seleccionado || !colectivos[seleccionado]) { box.classList.add('oculto'); return; }
    const id = seleccionado;
    const c = colectivos[id];
    const e = empresas[c.empresa];
    let h = '<div class="det-cab"><b>🚌 Colectivo N° ' + esc(c.numero) + '</b>' +
      '<button id="cerrarDetalle" class="cerrar">✕</button></div>' +
      'Empresa: ' + esc(e ? e.nombre : '-') + '<br>' +
      'Chapa: ' + esc(c.chapa) + ' · Año: ' + esc(c.anio) + '<br>' +
      'Conductor: ' + esc(c.chofer) + '<br>' +
      'Guarda: ' + esc(c.guarda) + '<br>' +
      'Ruta: ' + esc(c.ruta) + '<br>';
    if (estaActivo(id)) {
      const b = buses[id];
      h += '<span class="etq">En recorrido</span> salió ' + esc(textoSalida(b)) + '<br>' +
        '📍 Ahora: ' + esc(dondeEsta(id)) + '<br>';
      h += cajaMiParada(id) + selectorCerca(id);
      h += cajasViaje(b, geoListo(c.rutaId), velocidadUsada(id), paradasDe(c.rutaId));
      const ref = puntoRef();
      if (ref) { h += 'En línea recta está a ' + distanciaTexto(km(b, ref)) + ' de vos<br>'; }
      h += '<small id="senal"></small>';
    } else {
      h += '<span class="etq gris">No está en recorrido</span><br>' +
        'Próxima salida: ' + esc(proximaSalida(id) || 'sin horario') + '<br>' +
        'Hoy: ' + esc(salidasDe(id).map(etiquetaSalida).join(', ') || 'no hay salidas') + '<br>' +
        horariosCompletos(c) +
        (horarioCambiado(id) ? '<br><small>🕒 El chofer cambió el horario de hoy</small>'
          : (c.horarioFijo ? '<br><small>📌 Horario fijo</small>' : ''));
    }
    box.innerHTML = h;
    box.classList.remove('oculto');
    actualizarSenal();
  }

  function actualizarSenal() {
    const s = $('senal');
    if (s && seleccionado && buses[seleccionado]) {
      s.textContent = 'Última señal hace ' + Math.round((Date.now() - buses[seleccionado].hora) / 1000) + ' segundos';
    }
  }

  function renderResultados() {
    const cont = $('resultados');
    if (!filtro) { cont.innerHTML = ''; $('tituloRes').classList.add('oculto'); return; }
    $('tituloRes').classList.remove('oculto');
    const ids = Object.keys(colectivos).filter(function (id) {
      return filtro.rutas.indexOf(colectivos[id].rutaId) >= 0;
    });
    if (!ids.length) { cont.innerHTML = '<p>No hay colectivos para ese trayecto.</p>'; return; }
    const lista = ordenar(ids);
    const primero = lista.filter(function (id) { return estaActivo(id) && viene(id) !== false; })[0];
    cont.innerHTML = lista.map(function (id) { return filaBus(id, id === primero); }).join('');
  }

  function renderEmpresas() {
    // No redibujar mientras el pasajero está eligiendo un tiempo (se cerraría el selector)
    if (eligiendo()) return;
    let html = '';
    Object.keys(empresas).forEach(function (eid) {
      const ids = Object.keys(colectivos).filter(function (id) { return colectivos[id].empresa === eid; });
      const n = ids.filter(estaActivo).length;
      html += '<div class="empresa" data-empresa="' + esc(eid) + '"><b>' +
        (empresaAbierta === eid ? '▾ ' : '▸ ') + esc(empresas[eid].nombre) + '</b>' +
        '<span>' + n + ' de ' + ids.length + ' en recorrido</span></div>';
      if (empresaAbierta === eid) {
        html += ordenar(ids).map(function (id) { return filaBus(id, false, true); }).join('') ||
          '<p>Esta empresa no tiene colectivos cargados.</p>';
      }
    });
    $('empresas').innerHTML = html;
  }

  function render() {
    const n = activos().length;
    $('contador').textContent = n + (n === 1 ? ' colectivo en recorrido' : ' colectivos en recorrido');
    renderDetalle();
    renderResultados();
    renderEmpresas();
  }

  // ----- Buscador -----
  function llenarParadas() {
    const nombres = {};
    Object.keys(rutas).forEach(function (rid) {
      paradasDe(rid).forEach(function (p) { nombres[p.nombre] = true; });
    });
    $('listaParadas').innerHTML = Object.keys(nombres).map(function (n) {
      return '<option value="' + esc(n) + '">';
    }).join('');
  }

  function buscar() {
    const d = $('desde').value, h = $('hasta').value;
    if (!d.trim() && !h.trim()) { limpiar(); return; }
    const ok = Object.keys(rutas).filter(function (rid) {
      const a = d.trim() ? indice(rid, d) : 0;
      const b = h.trim() ? indice(rid, h) : paradasDe(rid).length - 1;
      return a >= 0 && b >= 0 && a < b;
    });
    filtro = { desde: d, hasta: h, rutas: ok };
    if (seleccionado && !visibleEnMapa(seleccionado)) { seleccionado = null; borrarRuta(); }
    actualizarMarcadores();
    render();
  }

  function limpiar() {
    $('desde').value = ''; $('hasta').value = '';
    filtro = null;
    actualizarMarcadores();
    render();
  }

  $('btnBuscar').onclick = buscar;
  $('btnLimpiar').onclick = limpiar;
  $('hasta').addEventListener('keydown', function (e) { if (e.key === 'Enter') buscar(); });

  // Sigue la ubicación del pasajero; centrar = mover el mapa hasta él
  let seguimiento = null;
  function pedirUbicacion(centrar) {
    if (!navigator.geolocation) { mostrarToast('Tu navegador no permite usar la ubicación'); return; }
    if (seguimiento !== null) {
      if (centrar && miPos) { mapa.setView([miPos.lat, miPos.lng], 12); }
      return;
    }
    $('btnUbic').textContent = 'Buscando tu ubicación...';
    let primera = true;
    seguimiento = navigator.geolocation.watchPosition(function (p) {
      miPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (!miMarcador) {
        miMarcador = L.circleMarker([miPos.lat, miPos.lng], {
          radius: 9, color: '#fff', weight: 3, fillColor: '#d93025', fillOpacity: 1
        }).bindTooltip('Vos').addTo(mapa);
      } else {
        miMarcador.setLatLng([miPos.lat, miPos.lng]);
      }
      if (primera && centrar) { mapa.setView([miPos.lat, miPos.lng], 12); }
      $('btnUbic').textContent = '📍 Ubicación activada';
      if (primera) { primera = false; render(); revisarLlegadas(); }
    }, function () {
      if (miPos) return;
      navigator.geolocation.clearWatch(seguimiento);
      seguimiento = null;
      $('btnUbic').textContent = '📍 Usar mi ubicación';
      mostrarToast('No se pudo obtener tu ubicación');
    }, { enableHighAccuracy: true });
  }
  $('btnUbic').onclick = function () { pedirUbicacion(true); };

  // ----- Clics en el panel -----
  $('panel').addEventListener('click', function (e) {
    if (e.target.closest('.aviso-min') && !e.target.closest('[data-aviso]')) return;
    const bell = e.target.closest('[data-aviso]');
    if (bell) { alternarAviso(bell.dataset.aviso); return; }
    if (e.target.id === 'btnMiParada') { pedirUbicacion(false); return; }
    if (e.target.id === 'cerrarDetalle') { deseleccionar(); return; }
    const emp = e.target.closest('[data-empresa]');
    if (emp) {
      empresaAbierta = (empresaAbierta === emp.dataset.empresa) ? null : emp.dataset.empresa;
      render();
      return;
    }
    const fila = e.target.closest('.bus-fila');
    if (fila) { seleccionar(fila.dataset.id); }
  });

  $('panel').addEventListener('change', function (e) {
    const cerca = e.target.closest('.sel-cerca');
    if (cerca) {
      const bus = cerca.dataset.id;
      minCerca[bus] = Number(cerca.value);
      delete avisadosCerca[bus];
      guardar('minCerca', minCerca);
      mostrarToast('Te avisamos cuando falten ' + cerca.value + ' min para que llegue');
      cerca.blur();
      if (!miPos) { pedirUbicacion(false); }
      revisarLlegadas();
      render();
      return;
    }
    const sel = e.target.closest('.sel-min');
    if (!sel) return;
    const id = sel.dataset.id;
    minAvisos[id] = Number(sel.value);
    guardar('minAvisos', minAvisos);
    const c = colectivos[id] || {};
    mostrarToast('N° ' + c.numero + ': te avisamos ' + sel.options[sel.selectedIndex].text + ' antes de salir' +
      '');
    sel.blur();
    revisarSalidas();
    render();
  });

  // ----- Campanita: avisos -----
  function cargar(k) {
    try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; }
  }
  function cargarTexto(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function guardar(k, v) {
    try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) {}
  }
  function pedirPermiso() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }
  // ¿Este colectivo tiene aviso? (solo por su propia campanita)
  function suscrito(id) { return !!avisos[id]; }

  function alternarAviso(id) {
    const c = colectivos[id] || {};
    if (avisos[id]) {
      delete avisos[id];
      delete minAvisos[id];
      guardar('minAvisos', minAvisos);
      mostrarToast('Avisos desactivados para el N° ' + c.numero);
    } else {
      avisos[id] = true;
      pedirPermiso();
      delete avisadosCerca[id];
      if (!miPos) { pedirUbicacion(false); }   // sin tu ubicación no se puede avisar cuando se acerque
      if (estaActivo(id)) {
        mostrarToast('Te avisamos cuando el N° ' + c.numero + ' esté cerca de tu parada');
      } else {
        mostrarToast('Avisos activados para el N° ' + c.numero + '. Elegí cuánto antes querés que te avisemos.');
      }
    }
    guardar('avisos', avisos);
    render();
    revisarLlegadas();
  }

  function infoBus(id) {
    const c = colectivos[id] || {};
    const e = empresas[c.empresa];
    return 'N° ' + c.numero + ' · ' + (e ? e.nombre : '') + ' · ' + (c.ruta || '') +
      '\nChapa ' + (c.chapa || '-') + ' · Conductor: ' + (c.chofer || '-');
  }

  // Aviso 1: "Inicio de recorrido"
  function revisarAvisos() {
    const ahora = activos();
    if (activosPrevios) {
      ahora.forEach(function (id) {
        if (activosPrevios.indexOf(id) < 0 && suscrito(id)) {
          const b = buses[id];
          notificar('🚌 Inicio de recorrido',
            infoBus(id) + '\nSalió ' + (b.salida || '') + ' hs · ' + dondeEsta(id), id);
        }
      });
    }
    activosPrevios = ahora;
  }

  // Aviso 2: "Está por salir" (X minutos antes de su horario)
  function revisarSalidas() {
    const n = new Date();
    const hoy = n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
    // Borrar registros de días anteriores
    Object.keys(enviados).forEach(function (k) { if (k.indexOf(hoy) !== 0) delete enviados[k]; });
    Object.keys(colectivos).forEach(function (id) {
      if (!suscrito(id) || estaActivo(id)) return;
      const c = colectivos[id];
      salidasDe(id).forEach(function (s) {
        const p = String(s.hora).split(':');
        const salida = new Date(n.getFullYear(), n.getMonth(), n.getDate(), Number(p[0]), Number(p[1]));
        const faltan = Math.round((salida - n) / 60000);
        const clave = hoy + '|' + id + '|' + s.hora + '|' + s.terminal;
        if (faltan >= 0 && faltan <= minDe(id) && !enviados[clave]) {
          enviados[clave] = true;
          notificar('⏰ Está por salir',
            infoBus(id) + '\nSale a las ' + s.hora + ' hs' + (s.terminal ? ' desde ' + s.terminal : '') + ' (en ' + faltan + ' min)', id);
        }
      });
    });
    guardar('enviados', enviados);
  }

  function notificar(titulo, cuerpo, id) {
    mostrarToast(titulo + ': ' + cuerpo.split('\n')[0], 20000);
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        const noti = new Notification(titulo, { body: cuerpo, tag: titulo + id });
        noti.onclick = function () { window.focus(); if (seleccionado !== id) seleccionar(id); };
      } catch (e) {}
    }
  }

  let toastTimer = null;
  function mostrarToast(t, ms) {
    const el = $('toast');
    el.textContent = t;
    el.classList.remove('oculto');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('oculto'); }, ms || 5000);
  }

  // ----- Escuchar Firebase en tiempo real -----
  db.ref('empresas').on('value', function (s) { empresas = s.val() || {}; render(); });
  db.ref('rutas').on('value', function (s) { rutas = s.val() || {}; llenarParadas(); render(); });
  db.ref('colectivos').on('value', function (s) {
    colectivos = s.val() || {};
    actualizarMarcadores();
    revisarSalidas();
    render();
  });
  let primeraSalidas = true;
  db.ref('salidasHoy').on('value', function (s) {
    const nuevo = s.val() || {};
    // Aviso de cambio de horario: solo a quien activó la campanita de ese colectivo
    if (!primeraSalidas) {
      Object.keys(nuevo).forEach(function (id) {
        const a = salidasHoy[id], b = nuevo[id];
        if (b && b.fecha === fechaHoy() && suscrito(id) && !estaActivo(id) && (!a || a.hora !== b.hora)) {
          notificar('🕒 Cambió el horario', infoBus(id) + '\nHoy sale a las ' + b.hora + ' hs', id);
        }
      });
    }
    primeraSalidas = false;
    salidasHoy = nuevo;
    revisarSalidas();
    render();
  });
  db.ref('buses').on('value', function (s) {
    buses = s.val() || {};
    registrarPosiciones();
    revisarAvisos();
    actualizarMarcadores();
    actualizarRuta();
    render();
    revisarLlegadas();
  });

  setInterval(actualizarSenal, 1000);
  setInterval(function () { revisarLlegadas(); revisarAvisos(); revisarSalidas(); actualizarMarcadores(); actualizarRuta(); render(); }, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chofer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  body { font-family: sans-serif; margin: 10px; max-width: 600px; }
  input, button { font-size: 18px; padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
  button { background: #1a73e8; color: #fff; border: 0; border-radius: 8px; }
  button.rojo { background: #d93025; }
  button.gris { background: #5f6368; }
  button:disabled { opacity: .45; }
  .fila { display: flex; gap: 8px; }
  .fila button { flex: 1; width: auto; font-size: 16px; }
  #tarjeta { background: #f1f3f4; border-radius: 10px; padding: 10px; margin: 10px 0; }
  #tarjeta p { margin: 4px 0; }
  #estadoHorario { background: #e8f0fe; border-radius: 10px; padding: 10px; margin: 8px 0; line-height: 1.5; font-size: 15px; }
  #estadoHorario.ok { background: #e6f4ea; }
  #mapa { height: 40vh; margin-top: 10px; }
  .oculto { display: none; }
  #error { color: #d93025; }
  input[type=time] { -webkit-appearance: none; display: block; min-height: 44px; }
</style>
</head>
<body>

<div id="login">
  <h3>Ingreso de chofer</h3>
  <input id="usuario" placeholder="Usuario" autocapitalize="none" autocorrect="off">
  <input id="clave" type="password" placeholder="Contraseña">
  <button id="btnLogin">Ingresar</button>
  <p id="error"></p>
</div>

<div id="panel" class="oculto">
  <div id="tarjeta"></div>

  <label for="hora">Hora de salida de hoy</label>
  <input id="hora" type="time">
  <div class="fila">
    <button id="btnActualizar">Actualizar horario</button>
    <button id="btnQuitar" class="gris">Quitar horario</button>
  </div>
  <div id="estadoHorario"></div>

  <button id="btn">Iniciar recorrido</button>
  <p id="info"></p>
  <div id="mapa"></div>
  <button id="btnSalir" class="rojo">Cerrar sesión</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAgXGe2yG3QDv7reBa0Oet5nGjK7XIQaA0",
    authDomain: "colectivos-7caae.firebaseapp.com",
    databaseURL: "https://colectivos-7caae-default-rtdb.firebaseio.com",
    projectId: "colectivos-7caae",
    appId: "1:419518705953:web:6a20b7cc82f3b1e368ce60"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  const $ = function (id) { return document.getElementById(id); };
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  const mapa = L.map('mapa').setView([-25.7, -57.2], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(mapa);

  let inicio = null;           // momento en que inició el recorrido
  let busId = null, datosBus = null, watchId = null, marcador = null, ultima = null, rumbo = null;
  let salidaRef = null;      // escucha del horario de hoy publicado
  let publicada = null;      // horario de hoy que ven los pasajeros: { hora, fecha } o null
  let primeraCarga = true;
  let guardando = false;
  let wakeLock = null;
  let lugar = '', ultGeo = null, buscandoLugar = false;  // ciudad donde está ahora

  // ----- Inicio de sesión -----
  $('btnLogin').onclick = function () {
    const u = $('usuario').value.trim().toLowerCase();
    const c = $('clave').value;
    $('error').textContent = '';
    if (!u || !c) { $('error').textContent = 'Completá usuario y contraseña'; return; }
    auth.signInWithEmailAndPassword(u + '@colectivos.app', c).catch(function (e) {
      if (e.code === 'auth/network-request-failed') {
        $('error').textContent = 'Sin conexión a internet. Revisá tu señal e intentá de nuevo';
      } else if (e.code === 'auth/too-many-requests') {
        $('error').textContent = 'Demasiados intentos. Esperá unos minutos';
      } else {
        $('error').textContent = 'Usuario o contraseña incorrectos';
      }
    });
  };

  auth.onAuthStateChanged(function (user) {
    if (!user) { mostrarLogin(); return; }
    const usuario = user.email.split('@')[0];
    db.ref('asignaciones/' + usuario).once('value').then(function (s) {
      busId = s.val();
      if (!busId) { throw new Error('Tu usuario no tiene un colectivo asignado'); }
      return db.ref('colectivos/' + busId).once('value');
    }).then(function (s) {
      datosBus = s.val();
      if (!datosBus) { throw new Error('No se encontraron los datos del colectivo'); }
      mostrarPanel();
    }).catch(function (e) {
      $('error').textContent = e.message;
      auth.signOut();
    });
  });

  function mostrarPanel() {
    $('login').classList.add('oculto');
    $('panel').classList.remove('oculto');
    $('tarjeta').innerHTML =
      '<p><b>Colectivo N° ' + esc(datosBus.numero) + '</b></p>' +
      '<p>Chapa: ' + esc(datosBus.chapa) + ' · Año: ' + esc(datosBus.anio) + '</p>' +
      '<p>Conductor: ' + esc(datosBus.chofer) + '</p>' +
      '<p>Guarda: ' + esc(datosBus.guarda) + '</p>' +
      '<p>Ruta: ' + esc(datosBus.ruta) + '</p>';
    mapa.invalidateSize();
    escucharHorario();
  }

  function mostrarLogin() {
    detener(false);
    if (salidaRef) { salidaRef.off(); salidaRef = null; }
    publicada = null; primeraCarga = true;
    busId = null; datosBus = null;
    $('hora').value = '';
    $('panel').classList.add('oculto');
    $('login').classList.remove('oculto');
    $('clave').value = '';
  }

  $('btnSalir').onclick = function () {
    detener(true).finally(function () { auth.signOut(); });
  };

  // ----- Horario de salida de hoy -----
  function fechaHoy() {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }

  // Escucha en vivo el horario que están viendo los pasajeros
  function escucharHorario() {
    if (salidaRef) { salidaRef.off(); }
    primeraCarga = true;
    salidaRef = db.ref('salidasHoy/' + busId);
    salidaRef.on('value', function (s) {
      const v = s.val();
      publicada = (v && v.fecha === fechaHoy()) ? v : null;
      // Al entrar, si ya había publicado la hora de hoy, la muestra en el selector
      if (primeraCarga && publicada && !$('hora').value) { $('hora').value = publicada.hora; }
      primeraCarga = false;
      pintarEstado();
    }, function () {
      $('estadoHorario').className = '';
      $('estadoHorario').textContent = 'No se pudo consultar el horario publicado';
    });
    pintarEstado();
  }

  function pintarEstado() {
    const el = $('estadoHorario');
    const h = $('hora').value;
    const pendiente = (h && (!publicada || publicada.hora !== h) && watchId === null)
      ? '<br>⚠️ Elegiste las ' + esc(h) + ' hs. Tocá <b>Actualizar horario</b> para que los pasajeros lo vean.' : '';
    if (publicada) {
      el.className = 'ok';
      el.innerHTML = '✅ Los pasajeros ven que hoy salís a las <b>' + esc(publicada.hora) + ' hs</b>.' + pendiente;
    } else {
      el.className = '';
      el.innerHTML = 'Sin cambio de horario: los pasajeros ven el horario normal.' + pendiente;
    }
  }

  function actualizarControles() {
    const enRecorrido = watchId !== null;
    $('hora').disabled = enRecorrido;
    $('btnActualizar').disabled = enRecorrido || guardando;
    $('btnQuitar').disabled = enRecorrido || guardando;
  }

  $('hora').addEventListener('input', pintarEstado);
  $('hora').addEventListener('change', pintarEstado);

  $('btnActualizar').onclick = function () {
    const h = $('hora').value;
    if (!h) { $('info').textContent = 'Elegí primero la hora de salida'; return; }
    guardando = true; actualizarControles();
    db.ref('salidasHoy/' + busId).set({ hora: h, fecha: fechaHoy() }).then(function () {
      $('info').textContent = '✅ Horario actualizado: los pasajeros ya ven las ' + h + ' hs';
    }).catch(function () {
      $('info').textContent = '❌ No se pudo actualizar el horario. Revisá tu conexión e intentá de nuevo';
    }).finally(function () { guardando = false; actualizarControles(); });
  };

  $('btnQuitar').onclick = function () {
    if (!publicada) {
      $('hora').value = '';
      pintarEstado();
      $('info').textContent = 'No hay ningún horario cambiado. Los pasajeros ya ven el horario normal';
      return;
    }
    guardando = true; actualizarControles();
    db.ref('salidasHoy/' + busId).remove().then(function () {
      $('hora').value = '';
      pintarEstado();
      $('info').textContent = '✅ Horario quitado: los pasajeros ven el horario normal';
    }).catch(function () {
      $('info').textContent = '❌ No se pudo quitar el horario. Revisá tu conexión e intentá de nuevo';
    }).finally(function () { guardando = false; actualizarControles(); });
  };

  // ----- Mantener la pantalla encendida durante el recorrido -----
  function mantenerPantalla() {
    if (!('wakeLock' in navigator) || (wakeLock && !wakeLock.released)) return;
    navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
  }
  function soltarPantalla() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  // El navegador la suelta si cambiás de app; al volver, se pide de nuevo
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && watchId !== null) { mantenerPantalla(); }
  });

  // ----- Recorrido -----
  $('btn').onclick = function () {
    if (watchId === null) {
      const h = $('hora').value;
      if (!h) { $('info').textContent = 'Elegí la hora de salida primero'; return; }
      // La hora con la que sale también queda publicada para los pasajeros
      db.ref('salidasHoy/' + busId).set({ hora: h, fecha: fechaHoy() }).catch(function () {});
      // Si la página se recargó en pleno viaje, se conserva la hora de inicio
      inicio = Date.now();
      db.ref('buses/' + busId).once('value').then(function (s) {
        const v = s.val();
        if (v && v.inicio && v.salida === h && Date.now() - v.hora < 60 * 60 * 1000) { inicio = v.inicio; }
      }).catch(function () {});
      $('info').textContent = 'Buscando ubicación...';
      watchId = navigator.geolocation.watchPosition(mostrar, error, { enableHighAccuracy: true });
      this.textContent = 'Terminar recorrido';
      this.classList.add('rojo');
      mantenerPantalla();
      actualizarControles();
    } else {
      detener(true);
    }
  };

  function detener(borrar) {
    const estabaEnRecorrido = watchId !== null;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    ultima = null; rumbo = null; lugar = ''; ultGeo = null;
    soltarPantalla();
    if (marcador) { mapa.removeLayer(marcador); marcador = null; }
    $('btn').textContent = 'Iniciar recorrido';
    $('btn').classList.remove('rojo');
    $('info').textContent = '';
    actualizarControles();
    if (borrar && busId) {
      const tareas = [db.ref('buses/' + busId).remove()];
      // Al terminar el recorrido, la hora de hoy se borra y vuelve el horario normal
      if (estabaEnRecorrido) {
        $('hora').value = '';
        tareas.push(db.ref('salidasHoy/' + busId).remove().catch(function () {}));
      }
      return Promise.all(tareas);
    }
    pintarEstado();
    return Promise.resolve();
  }

  function calcRumbo(a, b) {
    const r = Math.PI / 180;
    const y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);
    const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) -
              Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }

  // Averigua en qué ciudad/barrio está (OpenStreetMap). Máximo 1 consulta cada 20 s y solo si se movió 400 m
  function actualizarLugar(lat, lng) {
    if (buscandoLugar) return;
    const ahora = Date.now();
    if (ultGeo && (ahora - ultGeo.t < 20000 || mapa.distance([ultGeo.lat, ultGeo.lng], [lat, lng]) < 400)) return;
    buscandoLugar = true;
    ultGeo = { lat: lat, lng: lng, t: ahora };
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=es&lat=' + lat + '&lon=' + lng)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        const a = (j && j.address) || {};
        const n = a.city || a.town || a.village || a.municipality || a.suburb || a.hamlet || a.neighbourhood || a.county || '';
        if (n) { lugar = String(n).replace(/^Distrito de /i, ''); }
      })
      .catch(function () {})
      .finally(function () { buscandoLugar = false; });
  }

  function mostrar(pos) {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const actual = { lat: lat, lng: lng };
    actualizarLugar(lat, lng);

    // Dirección: primero la del celular; si no hay, la calculamos con el punto anterior
    const h = pos.coords.heading;
    if (h != null && !isNaN(h) && pos.coords.speed > 1) {
      rumbo = h;
      ultima = actual;
    } else if (!ultima) {
      ultima = actual;
    } else if (mapa.distance([ultima.lat, ultima.lng], [lat, lng]) > 15) {
      rumbo = calcRumbo(ultima, actual);
      ultima = actual;
    }

    $('info').textContent = 'Transmitiendo · Lat: ' + lat.toFixed(5) + ' | Lng: ' + lng.toFixed(5);
    db.ref('buses/' + busId).set({
      lat: lat, lng: lng, hora: Date.now(),
      rumbo: rumbo,
      lugar: lugar,
      inicio: inicio,
      salida: $('hora').value,
      numero: datosBus.numero || '',
      chapa: datosBus.chapa || '',
      anio: datosBus.anio || '',
      chofer: datosBus.chofer || '',
      guarda: datosBus.guarda || '',
      ruta: datosBus.ruta || ''
    });
    if (!marcador) {
      marcador = L.marker([lat, lng]).addTo(mapa);
      mapa.setView([lat, lng], 15);
    } else {
      marcador.setLatLng([lat, lng]);
    }
  }

  function error(e) { $('info').textContent = 'Error: ' + e.message; }

  actualizarControles();
</script>
</body>
</html>
